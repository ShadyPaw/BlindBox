name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: box
          POSTGRES_PASSWORD: box_test_password
          POSTGRES_DB: box_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U box -d box_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://box:box_test_password@localhost:5432/box_test
      REDIS_URL: redis://localhost:6379/0
      LOG_LEVEL: silent
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm db:validate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:deploy
      - run: pnpm db:seed:catalog
      - run: pnpm test:integration
      - run: pnpm build
        env:
          # Build must not query the catalog or any runtime infrastructure.
          API_INTERNAL_URL: http://127.0.0.1:9
          DATABASE_URL: postgresql://offline:offline@127.0.0.1:9/offline
          REDIS_URL: redis://127.0.0.1:9/0
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile apps build
      - run: docker compose --profile apps up -d --wait
      - name: Check frontend containers
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3000/health
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3001/health
      - run: docker compose --profile apps logs
        if: failure()
      - run: docker compose --profile apps down -v
        if: always()
